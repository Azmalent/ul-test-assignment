[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ul-test"
version = "0.1.0"
description = "Тестовое задание для Умной Логистики"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=1.4,<3",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.7,<3",
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scikit-learn>=1.4,<2",
    "catboost>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]

[project.scripts]
etl = "etl.__main__:main"
ml = "ml.__main__:main"

[tool.setuptools.packages.find]
include = ["etl*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires TEST_DATABASE_URL and source data",
]

[tool.pyright]
reportMissingImports = "none"
reportAttributeAccessIssue = "none"

[tool.ruff.lint]
select = [
    "E", 
    "W",
    "PL",
    "I", 
    "F", 
    "B", 
    "TD",
    "C4",  
    "PT",  
    "SIM", 
    "N",  
]

ignore = [
    "TD002", 
    "TD003",
    "TD004",
    "PLR2004",
    "PLR0913",
]

[tool.ruff]
line-length = 100
